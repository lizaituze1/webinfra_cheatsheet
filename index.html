<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">

<title>Linux Web Infrastructure Cheatsheet</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--tx:#1b2330;--mu:#5d6b7e;--bd:#dde2ea;--ac:#0a6cff;--acbg:#e6f0ff;--cb:#0f1722;--ct:#9be39b;--lab:#e8590c;--labbg:#fff0e6;--dg:#c92a2a}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0e131b;--card:#161d28;--tx:#e6ebf2;--mu:#93a1b5;--bd:#26303f;--ac:#5aa2ff;--acbg:#1a2a44;--cb:#080c12;--ct:#9be39b;--lab:#ffa06b;--labbg:#33200f;--dg:#ff8787}}
:root[data-theme=dark]{--bg:#0e131b;--card:#161d28;--tx:#e6ebf2;--mu:#93a1b5;--bd:#26303f;--ac:#5aa2ff;--acbg:#1a2a44;--cb:#080c12;--ct:#9be39b;--lab:#ffa06b;--labbg:#33200f;--dg:#ff8787}
*{box-sizing:border-box}body{margin:0;font:15px/1.5 system-ui,-apple-system,Segoe UI,sans-serif;background:var(--bg);color:var(--tx)}
header{position:sticky;top:0;z-index:5;background:var(--card);border-bottom:1px solid var(--bd);padding:10px 16px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
h1{font-size:17px;margin:0;flex:1 1 220px}
#q{flex:2 1 260px;padding:9px 12px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx);font-size:15px}
button{font:inherit;cursor:pointer;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:8px;padding:6px 10px}
button:hover{border-color:var(--ac)}
.wrap{display:flex;max-width:1200px;margin:0 auto}
nav{width:210px;flex:none;position:sticky;top:62px;align-self:flex-start;max-height:calc(100vh - 70px);overflow:auto;padding:14px 8px}
nav button{display:block;width:100%;text-align:left;border:0;background:none;padding:7px 10px;margin:1px 0}
nav button.on{background:var(--acbg);color:var(--ac);font-weight:600}
main{flex:1;min-width:0;padding:16px}
.intro{background:var(--acbg);border-radius:10px;padding:12px 14px;margin-bottom:14px}
.lab{background:var(--labbg);border-left:4px solid var(--lab);padding:10px 12px;border-radius:8px;margin:10px 0;font-size:14px}
h2{margin:0 0 8px;font-size:22px}h3{margin:18px 0 6px;font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--mu)}
.it{background:var(--card);border:1px solid var(--bd);border-radius:10px;margin:6px 0;padding:8px 10px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 8px}
.it.l{border-left:4px solid var(--lab)}.it.d{border-left:4px solid var(--dg)}
pre{margin:0;white-space:pre-wrap;word-break:break-word;background:var(--cb);color:var(--ct);border-radius:6px;padding:7px 10px;font:13px/1.45 ui-monospace,Menlo,Consolas,monospace}
.ds{grid-column:1/-1;color:var(--mu);font-size:14px}.ds b{color:var(--tx)}
.tag{font-size:11px;font-weight:700;color:var(--lab);margin-left:6px}.d .tag{color:var(--dg)}
.cp{align-self:start;font-size:12px}
.ref{grid-template-columns:70px 1fr}.ref b{font-family:ui-monospace,monospace;color:var(--ac)}
.step{display:flex;gap:10px;align-items:flex-start;background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:9px 12px;margin:6px 0}
.step input{margin-top:5px;width:18px;height:18px}.step.done{opacity:.55}
.step pre{margin-top:5px}
#prog{height:8px;background:var(--bd);border-radius:5px;overflow:hidden;margin:8px 0}#prog i{display:block;height:100%;background:var(--lab);width:0;transition:width .3s}
.res{color:var(--mu);font-size:13px;margin:4px 0 10px}
@media(max-width:760px){nav{position:static;width:100%;display:flex;overflow-x:auto;max-height:none;padding:6px}nav button{width:auto;white-space:nowrap}.wrap{display:block}}
</style>

{id:'fw',t:'🧱 Firewall',i:'A firewall allows or blocks traffic by port, IP and protocol. Ubuntu: ufw (simple). Raw: iptables. Red Hat: firewalld. Careful: don\'t block SSH (22) or you lock yourself out!',

{id:'ssl',t:'🔒 SSL/TLS & OpenSSL',i:'TLS encrypts traffic between client and server. A certificate proves identity; the private key must stay secret. A self-signed cert encrypts, but browsers do not trust it. SSL termination = the load balancer decrypts HTTPS and talks plain HTTP to backends.',

{id:'nginx',t:'🟢 Nginx (web server)',i:'Nginx serves static files and can act as a reverse proxy. Main config: /etc/nginx/nginx.conf. Sites: /etc/nginx/sites-available/ (enable via symlink into sites-enabled/).',

 ['upstream backend {\n  server web-01:80;\n  server web-02:80;\n}\nserver { listen 80; location / { proxy_pass http://backend; } }','Nginx can load balance too (round-robin by default)'],

 ['sudo apt install -y apache2','Install on Ubuntu'],['sudo apachectl configtest','Test config'],['sudo a2ensite mysite && sudo a2dissite 000-default','Enable/disable a site'],['sudo a2enmod ssl proxy proxy_http','Enable modules'],['sudo systemctl reload apache2','Reload'],['/etc/apache2/sites-available/','Apache vhost configs'],['/var/log/apache2/error.log','Apache error log']]},

{id:'ha',t:'⚖️ HAProxy (load balancer)',i:'A load balancer spreads requests across several servers so no single one is overloaded, and keeps working if one dies. Config structure: global → defaults → frontend (what clients hit) → backend (the servers).',
 note:'Lab goal: HAProxy on lb-01 does SSL termination and round-robin between web-01 and web-02. The config file is /etc/haproxy/haproxy.cfg.',
 x:[['sudo apt update && sudo apt install -y haproxy','Install on lb-01','l'],['sudo nano /etc/haproxy/haproxy.cfg','Edit the config','l'],['sudo haproxy -c -f /etc/haproxy/haproxy.cfg','CHECK config syntax before restarting','l'],['sudo systemctl restart haproxy','Apply changes','l'],['sudo journalctl -u haproxy -f','Watch logs','l'],['sudo tail -f /var/log/haproxy.log','Alternative log file'],

const $=s=>document.querySelector(s),main=$('#main'),nav=$('#nav');let cur='lab';
let done={};try{done=JSON.parse(localStorage.getItem('walk')||'{}')}catch(e){}
const el=(t,c,x)=>{const e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e};

function item(it,sec){
 if(it[0]==='#'){return el('h3','',it[1])}
 if(it[0]==='ref'){const d=el('div','it ref');d.append(el('b','',it[1]),el('span','',it[2]));return d}
 const d=el('div','it'+(it[2]==='l'?' l':it[2]==='d'?' d':''));
 const p=el('pre','',it[0]);const b=el('button','cp','Copy');
 b.onclick=()=>{(navigator.clipboard?navigator.clipboard.writeText(it[0]):Promise.reject()).catch(()=>{const r=document.createRange();r.selectNodeContents(p);const s=getSelection();s.removeAllRanges();s.addRange(r);try{document.execCommand('copy')}catch(e){}}).finally(()=>{b.textContent='✓';setTimeout(()=>b.textContent='Copy',1200)})};
 const ds=el('div','ds');ds.textContent=it[1];
 if(it[2]==='l'){ds.append(el('span','tag','LAB'))}
 if(it[2]==='d'){ds.append(el('span','tag','⚠ CAREFUL'))}
 d.append(p,b,ds);return d}

function render(){
 main.innerHTML='';const q=$('#q').value.trim().toLowerCase();
 if(q){
  let n=0;main.append(el('h2','','Search results'));
  S.forEach(s=>{if(s.type==='steps')return;const hits=s.x.filter(i=>i[0]!=='#'&&i.join(' ').toLowerCase().includes(q));
   if(!hits.length)return;main.append(el('h3','',s.t));hits.forEach(h=>{main.append(item(h));n++})});
  main.insertBefore(el('div','res',n+' result'+(n==1?'':'s')+' for “'+q+'”'),main.children[1]);return}
 const s=S.find(x=>x.id===cur);main.append(el('h2','',s.t),el('div','intro',s.i));
 if(s.note)main.append(el('div','lab',s.note));
 if(s.type==='steps'){
  const total=s.x.length;const pr=el('div');pr.id='prog';pr.append(el('i'));main.append(pr);
  const lab=el('div','res');main.append(lab);
  const upd=()=>{const c=s.x.filter((_,i)=>done[i]).length;pr.firstChild.style.width=(c/total*100)+'%';lab.textContent=c+' of '+total+' steps done'};
  s.x.forEach((st,i)=>{const w=el('div','step'+(done[i]?' done':''));const cb=document.createElement('input');cb.type='checkbox';cb.checked=!!done[i];
   cb.onchange=()=>{done[i]=cb.checked;w.classList.toggle('done',cb.checked);try{localStorage.setItem('walk',JSON.stringify(done))}catch(e){}upd()};
   const bx=el('div');bx.style.flex='1';bx.style.minWidth=0;bx.append(el('b','',(i+1)+'. '+st[0]),el('pre','',st[1]));w.append(cb,bx);main.append(w)});
  upd();return}
 s.x.forEach(i=>main.append(item(i)));scrollTo(0,0)}

S.forEach(s=>{const b=el('button','',s.t);b.dataset.id=s.id;b.onclick=()=>{cur=s.id;$('#q').value='';mark();render()};nav.append(b)});
const mark=()=>nav.querySelectorAll('button').forEach(b=>b.classList.toggle('on',b.dataset.id===cur&&!$('#q').value));
$('#q').oninput=()=>{mark();render()};
$('#th').onclick=()=>{const r=document.documentElement,d=matchMedia('(prefers-color-scheme:dark)').matches;const now=r.dataset.theme||(d?'dark':'light');r.dataset.theme=now==='dark'?'light':'dark'};
mark();render();
</script>
